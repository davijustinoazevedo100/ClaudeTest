<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Shape</title>
<style>
  @font-face { font-family: "Geist"; src: url(fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
  :root { --canvas: #E8E5E0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
  body { font-family: "Geist", sans-serif; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
  #fit { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage { position: relative; width: 1440px; height: 1440px; overflow: hidden; background: var(--canvas); }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  #shape { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 50% 50%; }
  .c { position: absolute; left: 0; top: 0; visibility: hidden; white-space: nowrap; }
  .g { position: absolute; left: 0; top: 0; }
  .tn { font-feature-settings: "tnum" 1; }
  svg { display: block; overflow: visible; }
  b, i, em { font-weight: inherit; font-style: normal; }

  #btnLabel { font-size: 18px; line-height: 22px; font-weight: 560; letter-spacing: -0.01em; color: #fff; }
  #art { background: #fff; overflow: hidden; }
  #art svg { width: 100%; height: 100%; }
  #wave { width: 21.4px; height: 0; }
  #wave i { position: absolute; left: 0; top: 0; width: 3.4px; border-radius: 1.7px; background: #fff; }
  #title { font-size: 16.5px; line-height: 20px; font-weight: 600; letter-spacing: -0.012em; color: #fff; }
  #artist { font-size: 14.5px; line-height: 18px; font-weight: 450; color: rgba(255,255,255,.55); }
  #ptrack { background: rgba(255,255,255,.22); }
  #tEl, #tRe { font-size: 12.5px; line-height: 16px; font-weight: 520; color: rgba(255,255,255,.5); }
  #blob { overflow: hidden; }
  #reveal, #blobReveal { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #blobReveal { visibility: hidden; }
  #spkInv, #tabsInv { position: absolute; left: 0; top: 0; }
  #tabs, #tabsInv { width: 252px; height: 36px; }
  #tabs span, #tabsInv span { position: absolute; top: 0; width: 84px; text-align: center; font-size: 15px; line-height: 36px; font-weight: 560; letter-spacing: -0.005em; }
  #tabs span { color: rgba(255,255,255,.62); }
  #tabsInv span { color: #0C0C0C; }
  #lbl { font-size: 13px; line-height: 16px; font-weight: 500; color: rgba(255,255,255,.55); }
  #total { font-size: 30px; line-height: 34px; font-weight: 620; letter-spacing: -0.025em; color: #fff; }
  #days { width: 312px; height: 16px; }
  #days span { position: absolute; top: 0; width: 30px; margin-left: -15px; text-align: center; font-size: 12px; line-height: 16px; font-weight: 520; color: #fff; }
  #tip { width: 118px; height: 28px; border-radius: 14px; background: #fff; }
  #tip span { position: absolute; left: 0; top: 0; width: 118px; text-align: center; font-size: 13px; line-height: 28px; font-weight: 560; color: #0C0C0C; }
  #tip span em { color: rgba(12,12,12,.45); }
  #key { display: flex; align-items: center; gap: 2px; font-size: 30px; line-height: 34px; font-weight: 600; color: #0C0C0C; }
  #pal { width: 392px; }
  #pholder { font-size: 17px; line-height: 20px; font-weight: 450; color: rgba(12,12,12,.36); }
  #ptext { font-size: 17px; line-height: 20px; font-weight: 520; color: #0C0C0C; }
  #ptext span { display: inline-block; }
  #esc { height: 22px; padding: 0 7px; border-radius: 6px; background: rgba(12,12,12,.06); font-size: 12px; line-height: 22px; font-weight: 520; color: rgba(12,12,12,.45); }
  #caret { width: 2px; height: 22px; border-radius: 1px; background: #0C0C0C; }
  #psep { width: 392px; height: 1px; background: rgba(12,12,12,.08); }
  #phl { width: 376px; height: 42px; border-radius: 12px; }
  .row { width: 352px; height: 46px; }
  .row svg { position: absolute; left: 0; top: 13px; }
  .row .lab { position: absolute; left: 32px; top: 0; font-size: 15px; line-height: 46px; font-weight: 500; }
  #ret { font-size: 15px; line-height: 20px; font-weight: 500; color: rgba(12,12,12,.4); }
  #toast { display: flex; align-items: center; gap: 10px; font-size: 16px; line-height: 22px; font-weight: 560; letter-spacing: -0.01em; color: #fff; }
  #cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; filter: drop-shadow(0 1.5px 2px rgba(0,0,0,.22)); }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 500 12px/1.4 "Geist", sans-serif; color: rgba(0,0,0,.45); font-feature-settings: "tnum" 1; user-select: none; }
  body.render #hud { display: none; }
</style>

        <div class="c row" id="row3"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#0C0C0C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.2 12.4A6.6 6.6 0 0 1 7.6 3.8a6.6 6.6 0 1 0 8.6 8.6z"/></svg><span class="lab"><b></b><i></i></span></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const RENDER = P.has('render');
if (RENDER) document.body.classList.add('render');

// ─── time ────────────────────────────────────────────────────────────────
// One beat comes from the song's measured grid; 7 bars of 4/4 is the loop.
const B = +P.get('beat') || 0.5;
const T = 28 * B;
const at = (bar, beat, frac = 0) => ((bar - 1) * 4 + beat - 1 + frac) * B;
const TRACK = { title: P.get('title') || 'Temp Track', artist: P.get('artist') || '120 BPM placeholder', dur: +P.get('dur') || 178 };

// ─── math ────────────────────────────────────────────────────────────────
const TAU = 2 * Math.PI;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const mix = (a, b, u) => a + (b - a) * u;
const mod = (x, m) => ((x % m) + m) % m;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const minjerk = u => (u = clamp(u), u * u * u * (10 + u * (6 * u - 15)));
const unjerk = s => { let lo = 0, hi = 1; for (let i = 0; i < 48; i++) { const m = (lo + hi) / 2; if (minjerk(m) < s) lo = m; else hi = m; } return (lo + hi) / 2; };
const r3 = x => Math.round(x * 1000) / 1000;
const r4 = x => Math.round(x * 10000) / 10000;
const hash = (a, b) => { let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// Closed-form spring step response: at rest at 0, target 1. sp = { r: response (s), z: damping ratio }.
function step(dt, sp) {
  if (dt <= 0) return 0;
  const w = TAU / sp.r, z = sp.z;
  if (z >= 1) return 1 - Math.exp(-w * dt) * (1 + w * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
// Free response: displacement x0 and velocity v0 relative to the target at dt = 0.
function free(dt, x0, v0, sp) {
  if (dt <= 0) return x0;
  const w = TAU / sp.r, z = sp.z;
  if (z >= 1) return Math.exp(-w * dt) * (x0 + (v0 + w * x0) * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return Math.exp(-z * w * dt) * (x0 * Math.cos(wd * dt) + ((v0 + z * w * x0) / wd) * Math.sin(wd * dt));
}

const SP = {
  shape: { r: 0.36, z: 0.84 },   // ≈0.8 % overshoot
  cam:   { r: 0.66, z: 0.96 },
  color: { r: 0.2,  z: 1 },
  press: { r: 0.12, z: 0.9 },
  fast:  { r: 0.2,  z: 0.92 },
  lead:  { r: 0.2,  z: 0.82 },   // leading edge of the knob / indicator
  trail: { r: 0.42, z: 0.9 },    // trailing edge
  in:    { r: 0.26, z: 1 },
  out:   { r: 0.15, z: 1 },
  draw:  { r: 0.62, z: 1 },
  tick:  { r: 0.32, z: 1 },
  back:  { r: 0.32, z: 0.74 },   // rubber band release
  caret: { r: 0.1,  z: 1 },
};

// A value whose target changes many times = its last target + one spring per change.
// Each change also contributes from the previous loop, so the value is periodic in T.
class Track {
  constructor(sp) { this.sp = sp; this.keys = []; this.ready = false; }
  to(t, v, sp) { this.keys.push({ t: mod(t, T), v, sp: sp || this.sp }); this.ready = false; return this; }
  prep() {
    this.keys.sort((a, b) => a.t - b.t);
    let prev = this.keys[this.keys.length - 1].v;
    this.base = prev;
    for (const k of this.keys) { k.d = k.v - prev; prev = k.v; }
    this.ready = true;
  }
  at(t) {
    if (!this.ready) this.prep();
    let v = this.base;
    for (const k of this.keys) if (k.d !== 0) v += k.d * (step(t - k.t, k.sp) + step(t - k.t + T, k.sp));
    return v;
  }
}
// Content visibility: a spring in at a, a faster spring out at b (b may run past the loop end).
class Win {
  constructor(a, b, si = SP.in, so = SP.out) { this.a = mod(a, T); this.b = this.a + (b - a); this.si = si; this.so = so; }
  at(t) {
    let v = 0;
    for (const m of [0, T]) v += step(t - this.a + m, this.si) - step(t - this.b + m, this.so);
    return clamp(v);
  }
}
const win = (a, b, si, so) => new Win(a, b, si, so);

// ─── beat grid ───────────────────────────────────────────────────────────
const E = {
  click1: at(1, 1), check: at(1, 3), island: at(1, 4),
  expand: at(2, 1), play: at(2, 2), grab: at(2, 3), drop: at(2, 4),
  slider: at(3, 1), vgrab: at(3, 2), vmax: at(3, 3), vdrop: at(3, 4),
  toggle: at(4, 1), flip: at(4, 2), tabs: at(4, 3), tab: at(4, 4),
  chart: at(5, 1), draw: at(5, 2), hover: at(5, 3), peak: at(5, 4),
  cmdk: at(6, 1), palette: at(6, 2), k1: at(6, 3), k2: at(6, 3, 0.5), k3: at(6, 4),
  enter: at(7, 1), toast: at(7, 2), back: at(7, 3), hoverBtn: at(7, 4),
};
const PRESS = 0.12;           // mouse-down this long before a click lands on the beat

// ─── world layout (px at 1x; the camera zooms) ──────────────────────────
const BAR = { l: -152, w: 304, y: 6 };                  // progress bar inside the player
const SL = { l: -156, w: 312, r: 156 };                 // volume slider track
const TAB0 = -302, TABW = 84;                           // left edge of the first tab
const CARD = { l: -308, t: -18 };                       // chart card top-left (= tabs top-left)
const PLOT = { l: CARD.l + 20, t: CARD.t + 130, w: 312, h: 106 };
const PAL = { l: -328, t: -27 };
const palH = n => 76 + 46 * n;
const DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const MIN = [112, 146, 98, 168, 132, 245, 203];          // minutes per day, 18h 24m in total
const dayX = i => PLOT.l + PLOT.w * i / 6;

// ─── the shape ───────────────────────────────────────────────────────────
const S = { cx: new Track(SP.shape), cy: new Track(SP.shape), w: new Track(SP.shape), h: new Track(SP.shape),
            r: new Track(SP.shape), press: new Track(SP.press), hover: new Track(SP.fast) };
const key = (t, o, sp) => { for (const k in o) S[k].to(t, o[k], sp); };
key(E.click1, { w: 72, h: 72, r: 36 });                                  // loader
key(E.check, { w: 84, h: 84, r: 42 }); key(E.check + 0.09, { w: 72, h: 72, r: 36 });   // success pulse
key(E.island, { w: 236, h: 56, r: 28 });
key(E.expand, { w: 344, h: 212, r: 32 });                                // player
key(E.slider, { cy: 6, w: 312, h: 56, r: 28 });                          // volume slider (flips white, see FLIPS)
key(E.toggle, { cx: -100, w: 112, h: 64, r: 32 });                       // toggle, left edge fixed
key(E.tabs, { cx: -176, w: 264, h: 48, r: 24 });                         // tabs, right edge fixed
key(E.chart, { cx: -132, cy: 126, w: 352, h: 288 });                     // chart card, top-left fixed

const PLAY = [[[6, 4], [13, 8], [13, 16], [6, 20]], [[13, 8], [20, 12], [20, 12], [13, 16]]];
const PAUSE = [[[6, 4], [10, 4], [10, 20], [6, 20]], [[14, 4], [18, 4], [18, 20], [14, 20]]];
const quad = (a, b, u) => 'M' + a.map((p, i) => `${r3(mix(p[0], b[i][0], u))} ${r3(mix(p[1], b[i][1], u))}`).join('L') + 'Z';
function waveLevel(i, t) {
  if (t < E.play) return 0;
  const sub = B / 2, n = Math.floor(t / sub);
  let e = 0;
  for (let k = n; k > n - 4; k--) {
    const tk = k * sub; if (tk < E.play - 1e-6) break;
    const amp = (0.35 + 0.65 * hash(i + 1, k)) * (k % 2 ? 0.72 : 1), dt = t - tk;
    e = Math.max(e, amp * (1 - Math.exp(-dt / 0.02)) * Math.exp(-dt / 0.17));
  }
  return e;
}
let measured = null;
function measure() {
  const cv = document.createElement('canvas').getContext('2d');
  cv.font = '520 17px Geist';
  measured = [0, 1, 2, 3].map(n => cv.measureText(QUERY.slice(0, n)).width);
  KEYS.forEach((k, n) => caretX.to(k, measured[n + 1] + 1.5));
}

// ─── seek(t): every style is a pure function of t ──────────────────────
function seek(time) {
  const t = mod(time, T);
  const z = Math.exp(C.lz.at(t)), fx = C.fx.at(t), fy = C.fy.at(t);
  el.world.style.transform = `translate(720px,720px) scale(${r4(z)}) translate(${r3(-fx)}px,${r3(-fy)}px)`;

  // shape
  const s = shapeAt(t), hov = clamp(S.hover.at(t));
  const ss = el.shape.style;
  ss.left = r3(s.x0) + 'px'; ss.top = r3(s.y0) + 'px'; ss.width = r3(s.w) + 'px'; ss.height = r3(s.h) + 'px';
  ss.borderRadius = r3(s.r) + 'px';
  ss.transform = `scale(${r4(S.press.at(t))})`;
  const lx = x => x - s.x0, ly = y => y - s.y0;
  // colour: the old colour underneath, the new one growing inside until it covers the shape
  const fl = flipAt(FLIPS, t), done = fl.p * OVERGROW >= 1.002;
  const flipping = fl.p > 0.0005 && !done;
  const lum = mix(fl.from, fl.to, clamp(fl.p * OVERGROW));
  ss.background = rgb((done ? fl.to : fl.from) ? PAPER : mixc(INK, LIFT, hov));
  ss.boxShadow = `0 1px 2px rgba(0,0,0,${(0.06 + 0.02 * lum).toFixed(3)}), 0 12px 28px -12px rgba(0,0,0,${mix(0.32, 0.2, lum).toFixed(3)}), 0 0 0 .5px rgba(0,0,0,${(0.07 * lum).toFixed(3)})`;
  const region = flipping ? { ...flipRegion(fl, fl.p, s), t: fl.t } : null;
  el.reveal.style.visibility = region ? 'visible' : 'hidden';
  if (region) {
    el.reveal.style.background = rgb(fl.to ? PAPER : INK);
    el.reveal.style.clipPath = insetOf(region, s);
  }

  // 1 button label
  let v = V.btn.at(t);
  if (show(el.btnLabel, v, z)) put(el.btnLabel, s.w / 2, s.h / 2, 0.5, 0.5, 0.93 + 0.07 * v);

  // 2 loader: the arc whips around once per beat, fastest on the beat, then closes into a ring
  v = V.loader.at(t);
  if (show(el.loader, v, z)) {
    put(el.loader, s.w / 2, s.h / 2, 0.5, 0.5, 0.9 + 0.1 * v);
    const u = t / B + 0.5, f = u - Math.floor(u), e = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
    const close = step(t - E.check, SP.fast);
    const len = mix(0.18 + 0.44 * smooth(E.click1, E.check, t), 1, close);
    el.arc.setAttribute('transform', `rotate(${r3((Math.floor(u) + e) * 360 - 90)})`);
    el.arc.style.strokeDasharray = `${r3(len * ARC_C)} ${r3(ARC_C)}`;
  }
  // 3 check draws itself
  v = V.check.at(t);
  if (show(el.check, v, z)) {
    put(el.check, s.w / 2, s.h / 2, 0.5, 0.5, 1);
    el.checkPath.style.strokeDashoffset = r3(100 * (1 - clamp(step(t - E.check - 0.03, { r: 0.34, z: 1 }))));
  }

  // 4–5 island → player
  v = V.art.at(t);
  if (show(el.art, v, z)) {
    const sz = A.s.at(t);
    put(el.art, lx(A.x.at(t)) + sz / 2, ly(A.y.at(t)) + sz / 2, 0.5, 0.5, 0.9 + 0.1 * v);
    el.art.style.width = el.art.style.height = r3(sz) + 'px';
    el.art.style.borderRadius = r3(A.r.at(t)) + 'px';
    const dt = Math.max(0, t - E.play);
    el.disc.setAttribute('transform', `rotate(${r3(170 * (dt - 0.25 * (1 - Math.exp(-dt / 0.25))))} 50 50)`);
  }
  v = V.wave.at(t);
  if (show(el.wave, v, z)) {
    put(el.wave, lx(W.x.at(t)) - 21.4, ly(W.y.at(t)), 0, 0, 1);
    const live = step(t - E.play, SP.fast);
    waveBars.forEach((b, i) => {
      const h = mix([6, 10, 7, 8][i], 5 + 13 * waveLevel(i, t), live);  // a resting equalizer until play
      b.style.left = (i * 6) + 'px'; b.style.top = r3(-h / 2) + 'px'; b.style.height = r3(h) + 'px';
      b.style.opacity = r4(0.45 + 0.55 * live);
    });
  }
  v = V.title.at(t);
  if (show(el.title, v, z)) put(el.title, lx(-72) + (1 - v) * 8, ly(-76), 0, 0, 1);
  v = V.artist.at(t);
  if (show(el.artist, v, z)) put(el.artist, lx(-72) + (1 - v) * 8, ly(-54), 0, 0, 1);
  const th = thick.at(t);
  v = V.ptrack.at(t);
  if (show(el.ptrack, v, z)) {
    put(el.ptrack, lx(BAR.l), ly(BAR.y - th / 2), 0, 0, 1);
    Object.assign(el.ptrack.style, { width: BAR.w + 'px', height: r3(th) + 'px', borderRadius: r3(th / 2) + 'px' });
  }
  v = V.times.at(t);
  const tShown = show(el.tEl, v, z);
  show(el.tRe, v, z);
  if (tShown) {
    const p = progress(t);
    setText(el.tEl, fmt(p * TRACK.dur)); setText(el.tRe, '−' + fmt(TRACK.dur - p * TRACK.dur));
    put(el.tEl, lx(BAR.l), ly(BAR.y + th / 2 + 7), 0, 0, 1);
    put(el.tRe, lx(BAR.l + BAR.w), ly(BAR.y + th / 2 + 7), 1, 0, 1);
  }
  [el.prev, el.pp, el.next].forEach((e, i) => {
    const vi = V.ctrl[i].at(t);
    if (show(e, vi, z)) put(e, lx(-64 + 64 * i), ly(66), 0.5, 0.5, (0.86 + 0.14 * vi) * (i === 1 ? ppPress.at(t) : 1));
  });
  if (el.pp.style.visibility === 'visible') {
    const u = step(t - E.play, { r: 0.3, z: 0.86 });
    el.ppA.setAttribute('d', quad(PLAY[0], PAUSE[0], u)); el.ppB.setAttribute('d', quad(PLAY[1], PAUSE[1], u));
  }

  // 6–9 blob: progress fill → volume fill → knob → indicator
  const bl = blobAt(t);
  v = V.blob.at(t);
  if (show(el.blob, v, z)) {
    put(el.blob, lx(bl.x0), ly(bl.y0), 0, 0, 1);
    const bf = flipAt(BLOB_FLIPS, t), inRegion = region && region.t === bf.t;
    const blobDone = bf.t !== fl.t || done;                                   // a blob flip always rides a shape flip
    Object.assign(el.blob.style, { width: r3(bl.x1 - bl.x0) + 'px', height: r3(bl.y1 - bl.y0) + 'px', borderRadius: r3(Math.min(bl.r, (bl.x1 - bl.x0) / 2, (bl.y1 - bl.y0) / 2)) + 'px',
      background: rgb((blobDone ? bf.to : bf.from) ? PAPER : INK) });
    el.blobReveal.style.visibility = inRegion ? 'visible' : 'hidden';
    if (inRegion) {
      el.blobReveal.style.background = rgb(bf.to ? PAPER : INK);
      el.blobReveal.style.clipPath = insetOf(region, bl);
    }
  }
  // 7 speaker (black copy on the track, white copy inside the fill)
  v = V.spk.at(t);
  if (show(el.spk, v, z)) {
    const pop = step(t - E.vmax, SP.press) - step(t - E.vmax - 0.1, SP.fast);     // the icon kicks when it hits max
    const ix = s.x0 + 30, iy = s.cy, sc = (0.9 + 0.1 * v) * (1 + 0.16 * pop);     // icon centre, world
    put(el.spk, lx(ix), ly(iy), 0.5, 0.5, sc);
    show(el.spkInv, v, z);
    put(el.spkInv, ix - bl.x0, iy - bl.y0, 0.5, 0.5, sc);
    const lv = level(t);
    spkWaves.forEach(ws => ws.forEach((w, k) => { w.style.opacity = r4(smooth([0.08, 0.42, 0.78][k], [0.16, 0.5, 0.86][k], lv)); }));
  } else el.spkInv.style.visibility = 'hidden';

  // 9 tabs (labels invert inside the indicator)
  let anyTab = false;
  tabEls.forEach((e, i) => {
    const vi = V.tabs[i].at(t);
    const on = vi > 0.002;
    anyTab = anyTab || on;
    e.style.opacity = tabInvEls[i].style.opacity = r4(vi);
    e.style.filter = tabInvEls[i].style.filter = vi > 0.995 ? 'none' : `blur(${r3((1 - vi) * BLUR / z)}px)`;
  });
  el.tabs.style.visibility = el.tabsInv.style.visibility = anyTab ? 'visible' : 'hidden';
  if (anyTab) {
    put(el.tabs, lx(TAB0), ly(-12), 0, 0, 1);
    el.tabsInv.style.left = r3(TAB0 - bl.x0) + 'px'; el.tabsInv.style.top = r3(-12 - bl.y0) + 'px';
  }

  // 10 chart card
  el.card.style.left = r3(lx(CARD.l)) + 'px'; el.card.style.top = r3(ly(CARD.t)) + 'px';
  v = V.lbl.at(t);
  if (show(el.lbl, v, z)) put(el.lbl, 20, 62 + (1 - v) * 6, 0, 0, 1);
  const pd = clamp(step(t - E.draw, SP.draw));
  v = V.total.at(t);
  if (show(el.total, v, z)) { put(el.total, 20, 80 + (1 - v) * 6, 0, 0, 1); setText(el.total, hm(Math.round(1104 * pd))); }
  v = V.plot.at(t);
  if (show(el.plot, v, z)) {
    put(el.plot, 20, 130, 0, 0, 1);
    el.line.style.strokeDashoffset = r3(LINE_LEN * (1 - pd));
    el.line.style.opacity = pd > 0.002 ? 1 : 0;
    const head = pd > 0.002 ? el.line.getPointAtLength(LINE_LEN * pd).x : 0;
    el.clipR.setAttribute('width', r3(head + 4));
  }
  v = V.days.at(t);
  const hv = V.hov.at(t), dx = dotX.at(t) - PLOT.l;
  if (show(el.days, v, z)) {
    put(el.days, 20, 250, 0, 0, 1);
    dayEls.forEach((d, i) => { d.style.opacity = r4(0.42 + 0.58 * hv * clamp(1 - Math.abs(dx - PLOT.w * i / 6) / 30)); });
  }
  if (show(el.hov, hv, z)) {
    put(el.hov, 20, 130, 0, 0, 1);
    const dy = curveY(dx);
    el.guide.setAttribute('x1', r3(dx)); el.guide.setAttribute('x2', r3(dx));
    el.dot.setAttribute('cx', r3(dx)); el.dot.setAttribute('cy', r3(dy));
    el.dot.setAttribute('r', r3(5 * (0.6 + 0.4 * hv)));
  }
  tipEls.forEach((e, i) => { const vi = V.tip[i].at(t); e.style.opacity = r4(vi); e.style.filter = vi > 0.995 ? 'none' : `blur(${r3((1 - vi) * 6 / z)}px)`; });
  if (show(el.tip, hv, z)) put(el.tip, 20 + dx, 130 + curveY(dx) - 14, 0.5, 1, 0.9 + 0.1 * hv);

  // 11 ⌘K keycap
  v = V.key.at(t);
  if (show(el.key, v, z)) put(el.key, s.w / 2, s.h / 2, 0.5, 0.5, 0.9 + 0.1 * v);

  // 12 palette
  el.pal.style.left = r3(lx(PAL.l)) + 'px'; el.pal.style.top = r3(ly(PAL.t)) + 'px';
  if (show(el.psearch, V.psearch.at(t), z)) put(el.psearch, 20, 20, 0, 0, 1);
  if (show(el.pholder, V.pholder.at(t), z)) put(el.pholder, 52, 20, 0, 0, 1);
  if (show(el.esc, V.psearch.at(t), z)) put(el.esc, 392 - 18, 30, 1, 0.5, 1);
  const ql = queryLen(t), q = QUERY.slice(0, ql);
  let anyChar = 0;
  charEls.forEach((c, i) => { const vi = V.chars[i].at(t); anyChar = Math.max(anyChar, vi); c.style.opacity = r4(vi); c.style.transform = `translateY(${r3((1 - vi) * 5)}px)`; c.style.filter = vi > 0.99 ? 'none' : `blur(${r3((1 - vi) * 6 / z)}px)`; });
  el.ptext.style.visibility = anyChar > 0.002 ? 'visible' : 'hidden';
  put(el.ptext, 52, 20, 0, 0, 1);
  const typing = t >= E.k1 - 0.05 && t < E.k3 + 0.3;              // solid while typing, blinks on the beat otherwise
  const blink = typing || mod(t / B, 1) < 0.5 ? 1 : 0;
  if (show(el.caret, V.caret.at(t) * blink, z)) put(el.caret, 52 + caretX.at(t), 19, 0, 0, 1);
  if (show(el.psep, V.psep.at(t), z)) put(el.psep, 0, 60, 0, 0, 1);
  if (show(el.phl, V.phl.at(t), z)) {
    put(el.phl, 8, 70, 0, 0, 1);
    const flash = step(t - E.enter, { r: 0.06, z: 1 }) - step(t - E.enter - 0.06, { r: 0.2, z: 1 });
    el.phl.style.background = `rgba(12,12,12,${(0.055 + 0.07 * clamp(flash)).toFixed(3)})`;
  }
  rows.forEach((r, i) => {
    const vi = rowWins[i].at(t);
    if (!show(r.el, vi, z)) return;
    put(r.el, 20, 68 + 46 * slotTracks[i].at(t) + 23, 0, 0.5, 0.96 + 0.04 * vi);
    if (r.q !== ql) {
      r.q = ql;
      const label = CMDS[i], hit = q && label.toLowerCase().startsWith(q) ? q.length : 0;
      r.b.textContent = label.slice(0, hit); r.i.textContent = label.slice(hit);
      r.b.style.color = '#0C0C0C'; r.i.style.color = ql ? 'rgba(12,12,12,.42)' : 'rgba(12,12,12,.86)';
    }
  });
  if (show(el.ret, V.ret.at(t), z)) put(el.ret, 392 - 24, 68 + 23, 1, 0.5, 1);

  // 13 toast
  v = V.toast.at(t);
  if (show(el.toast, v, z)) {
    put(el.toast, s.w / 2, s.h / 2, 0.5, 0.5, 0.92 + 0.08 * v);
    el.tCheck.style.strokeDashoffset = r3(100 * (1 - clamp(step(t - E.toast, SP.tick))));
  }

  // cursor (screen space, rides on the world point it is touching)
  const cp = cursorAt(t), cv = cursorVis.at(t);
  const sx = 720 + (cp.x - fx) * z, sy = 720 + (cp.y - fy) * z;
  el.cursor.style.opacity = r4(cv);
  el.cursor.style.visibility = cv < 0.002 ? 'hidden' : 'visible';
  el.cursor.style.transform = `translate(${r3(sx - 2.75)}px,${r3(sy - 2.475)}px) scale(${r4(CP.at(t))})`;
  el.cursor.style.transformOrigin = '2.75px 2.475px';

  if (!RENDER) {
    const b = Math.floor(t / B + 1e-6);
    el.hud.textContent = `${t.toFixed(2)}s   bar ${Math.floor(b / 4) + 1}.${b % 4 + 1}   space play/pause · ←→ step · click scrub`;
  }
}

// Numbers that must match across the loop seam (cursor position and speed included).
// Hidden elements are weighted out: only what is on screen has to line up.
const SAMPLE_NAMES = ['cam.fx', 'cam.fy', 'cam.lz', 'shape.cx', 'shape.cy', 'shape.w', 'shape.h', 'shape.r', 'shape.lum', 'shape.press', 'shape.hover',
  'cursor.x', 'cursor.y', 'cursor.press', 'cursor.vis', 'blob.x0', 'blob.x1', 'blob.y0', 'blob.y1', 'vis.btn', 'vis.toast'];
function sample(time) {
  const t = mod(time, T), s = shapeAt(t), c = cursorAt(t), b = blobAt(t), bv = V.blob.at(t);
  return [C.fx.at(t), C.fy.at(t), C.lz.at(t), s.cx, s.cy, s.w, s.h, s.r, shapeLum(t), S.press.at(t), S.hover.at(t), c.x, c.y, CP.at(t), cursorVis.at(t),
    b.x0 * bv, b.x1 * bv, b.y0 * bv, b.y1 * bv, V.btn.at(t), V.toast.at(t)];
}
// Position and speed on both sides of the seam: a jump shows up as a huge slope or speed change.
function loopCheck(d = 1e-4) {
  const a = sample(T - d), b = sample(d), a2 = sample(T - 2 * d), b2 = sample(2 * d);
  let worst = { slope: 0, speedJump: 0, slopeAt: '', speedAt: '' };
  a.forEach((x, i) => {
    const slope = Math.abs(x - b[i]) / (2 * d), speedJump = Math.abs((b2[i] - b[i]) - (a[i] - a2[i])) / d;
    if (slope > worst.slope) Object.assign(worst, { slope, slopeAt: SAMPLE_NAMES[i] });
    if (speedJump > worst.speedJump) Object.assign(worst, { speedJump, speedAt: SAMPLE_NAMES[i] });
  });
  return worst;
}

const ready = document.fonts.load('560 18px Geist').then(() => document.fonts.ready).then(() => { measure(); seek(+P.get('t') || 0); });
window.MORPH = { T, B, E, seek, sounds: SOUNDS, ready, loopCheck, sample, track: TRACK };

// ─── preview player (not used by the renderer) ─────────────────────────
if (!RENDER) {
  el.aud.src = 'audio/mix.wav';
  const fit = () => {
    const k = Math.min(innerWidth, innerHeight - 24) / 1440;
    el.fit.style.transform = `translate(${(innerWidth - 1440 * k) / 2}px,0) scale(${k})`;
  };
  addEventListener('resize', fit); fit();
  let playing = false, t = +P.get('t') || 0, last = 0;
  const toggle = () => {
    playing = !playing;
    if (playing) { el.aud.currentTime = mod(t, T); el.aud.play().catch(() => {}); } else el.aud.pause();
    last = performance.now();
  };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { playing = false; el.aud.pause(); t = mod(t + (e.code === 'ArrowRight' ? 1 : -1) / 60, T); }
  });
  el.fit.addEventListener('click', e => { const r = el.fit.getBoundingClientRect(); t = (e.clientX - r.left) / r.width * T; el.aud.currentTime = t; });
  ready.then(() => {
    const loop = now => {
      if (playing) {
        t = !el.aud.paused && el.aud.readyState >= 2 ? el.aud.currentTime : t + (now - last) / 1000;
        if (t >= T) { t = mod(t, T); el.aud.currentTime = t; }
      }
      last = now;
      seek(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
})();
</script>
